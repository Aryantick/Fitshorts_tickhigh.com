name: Deploy Backend to AWS EC2 (Amazon Linux 2023)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Amazon Linux EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }} # Set to 'ec2-user' in GitHub Secrets
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Starting deployment on Amazon Linux EC2..."
            cd /home/ec2-user/tickhigh-fitshort/backend
            git pull origin main
            npm install --production
            node scripts/runMigration003.js
            pm2 reload all --update-env || pm2 start src/app.js --name "fitshorts-api"
            echo "Deployment completed successfully!"
